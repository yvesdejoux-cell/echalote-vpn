name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Fetch and verify Tor
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Restore
        run: dotnet restore EchaloteVpn.slnx

      - name: Build
        run: dotnet build EchaloteVpn.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EchaloteVpn.slnx --configuration Release --no-build --verbosity normal

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/EchaloteVpn.Service/EchaloteVpn.Service.csproj -c Release -r win-x64 --self-contained -o publish/EchaloteVpn/service
          dotnet publish src/EchaloteVpn.App/EchaloteVpn.App.csproj -c Release -r win-x64 --self-contained -o publish/EchaloteVpn/app
          if (-not (Test-Path publish/EchaloteVpn/service/tor-bundle/tor/tor.exe)) { throw 'tor.exe manquant dans la publication.' }

      - uses: actions/upload-artifact@v5
        with:
          name: EchaloteVpn-win-x64
          path: publish/EchaloteVpn
          retention-days: 14
